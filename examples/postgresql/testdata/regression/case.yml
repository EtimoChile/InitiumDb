# Example case. The directory is the case; this file only lists the databases to process, in
# order. Every other file is found by convention next to it: <ALIAS>.queries.yml,
# <ALIAS>.dataset.xml and the optional hooks <ALIAS>.pre.sql and <ALIAS>.post.sql.
# The alias CRM is resolved to a real database by config/dev.yml.
version: 1
databases:
  - alias: CRM
