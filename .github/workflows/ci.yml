name: CI

on:
  workflow_dispatch:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Build and test
        run: mvn -B clean verify

      - name: Coverage summary
        run: |
          {
            echo "### Unit test coverage"
            python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def pct(kind):
              missed = sum(int(r[kind + "_MISSED"]) for r in rows)
              covered = sum(int(r[kind + "_COVERED"]) for r in rows)
              return f"{100 * covered / max(missed + covered, 1):.1f}% ({covered}/{missed + covered})"
          print(f"- Lines: {pct('LINE')}")
          print(f"- Branches: {pct('BRANCH')}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: target/jacoco.exec
          if-no-files-found: error
          retention-days: 1

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ github.run_id }}
          path: |
            target/initiumdb-*-dist.zip
            target/initiumdb-*-dist.tar.gz
          retention-days: 7

  postgresql-integration:
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: target

      - name: PostgreSQL container tests with combined coverage
        run: mvn -B test jacoco:report -Ppostgresql-integration

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-postgresql-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 14

  oracle-integration:
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: target

      - name: Oracle container tests with combined coverage
        run: mvn -B test jacoco:report -Poracle-integration

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-oracle-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 14
