name: Release

# Runs when a tag vX.Y.Z is pushed from main. The pom version on that commit must be X.Y.Z.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: The tag matches the pom version
        run: |
          version=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom version $version" >&2
            exit 1
          fi
      - name: Build and test
        run: mvn -B clean verify
      - name: Checksums
        working-directory: target
        run: sha256sum initiumdb-*-dist.zip initiumdb-*-dist.tar.gz > SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md \
            target/initiumdb-*-dist.zip target/initiumdb-*-dist.tar.gz target/SHA256SUMS
